codecov:
  notify:
    after_n_builds: 3
    wait_for_ci: false

  require_ci_to_pass: false

coverage:
  range: 90..100
  status:
    project:
      default:
        target: 100%
        threshold: 10%
      app:
        target: 100%
        threshold: 100%
        paths:
          - src/
      tests:
        target: 100%
        paths:
          - tests/

    patch:
      default:
        target: 100%
        threshold: 10%
      app:
        target: 100%
        threshold: 10%
        paths:
          - src/
      tests:
        target: 100%
        paths:
          - tests/
