apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: ${APP_NAME}

objects:
  - apiVersion: cloud.redhat.com/v1alpha1
    kind: ClowdApp
    metadata:
      name: ${APP_NAME}

    spec:
      envName: ${ENV_NAME}

      dependencies:
        - host-inventory
        - rbac
        - kessel-inventory

      kafkaTopics:
        - topicName: platform.notifications.ingress
          partitions: 24
          replicas: 3

      deployments:
        - name: api
          minReplicas: ${{MIN_REPLICAS}}
          deploymentStrategy:
            privateStrategy: RollingUpdate

          webServices:
            public:
              enabled: true
              apiPath: ${APP_NAME}

          podSpec:
            image: ${IMAGE}:${IMAGE_TAG}
            env:
              - name: APP_NAME
                value: ${APP_NAME}

              - name: ROADMAP_HOST_INVENTORY_URL
                value: ${ROADMAP_HOST_INVENTORY_URL}

              - name: ROADMAP_DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.host

              - name: ROADMAP_DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.port

              - name: ROADMAP_DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.name

              - name: ROADMAP_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.user

              - name: ROADMAP_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.password

              - name: ROADMAP_DB_POOL_SIZE
                value: ${ROADMAP_DB_POOL_SIZE}

              - name: ROADMAP_DB_MAX_OVERFLOW
                value: ${ROADMAP_DB_MAX_OVERFLOW}

              - name: SENTRY_DSN
                valueFrom:
                  secretKeyRef:
                    name: ${SENTRY_SECRET_NAME}
                    key: dsn
                    optional: true

              - name: ROADMAP_SUBSCRIPTIONS_URL
                valueFrom:
                  secretKeyRef:
                    name: ${SUBSCRIPTION_SECRET_NAME}
                    key: url
                    optional: true

              - name: SENTRY_ENVIRONMENT
                value: ${ENV_NAME}

              - name: ROADMAP_ENV_NAME
                value: ${ENV_NAME}

              # Security logging and monitoring (SEC-MON-REQ-1). Logs go to
              # stdout and the cluster log forwarder ships them to Splunk, so
              # they have to be JSON for Splunk to extract fields from them.
              # The default in Settings is false, which gives human-readable
              # console output for local development only.
              - name: ROADMAP_JSON_LOGGING
                value: ${ROADMAP_JSON_LOGGING}

              # Events of interest are emitted at INFO. Raising this above INFO
              # would drop ordinary application logs but NOT the audit events:
              # the roadmap.security logger is pinned to INFO in custom_logging.
              - name: ROADMAP_LOG_LEVEL
                value: ${ROADMAP_LOG_LEVEL}

              # Egress monitoring (SEC-NET-REQ-5). Outbound connections are
              # always logged; this only controls whether a destination
              # outside the allow list is also blocked.
              - name: ROADMAP_EGRESS_ENFORCE
                value: ${ROADMAP_EGRESS_ENFORCE}

              # Kessel / RBAC v2 authorization. Off by default; set the
              # KESSEL_ENABLED parameter to "true" per environment to use the
              # Kessel gRPC Inventory API instead of the legacy RBAC v1 path.
              # The container env vars keep the ROADMAP_ prefix (Settings uses
              # env_prefix="ROADMAP_"); the template parameters are unprefixed
              # to match the shared app-sre KESSEL_* parameters.
              - name: ROADMAP_KESSEL_ENABLED
                value: ${KESSEL_ENABLED}

              - name: ROADMAP_KESSEL_URL
                value: ${KESSEL_URL}

              - name: ROADMAP_KESSEL_INSECURE
                value: ${KESSEL_INSECURE}

              - name: ROADMAP_KESSEL_AUTH_ENABLED
                value: ${KESSEL_AUTH_ENABLED}

              - name: ROADMAP_KESSEL_AUTH_OIDC_ISSUER
                value: ${KESSEL_AUTH_OIDC_ISSUER}

              - name: ROADMAP_KESSEL_PRINCIPAL_DOMAIN
                value: ${KESSEL_PRINCIPAL_DOMAIN}

              - name: ROADMAP_KESSEL_AUTH_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: client-id
                    key: kessel-authentication
                    optional: true

              - name: ROADMAP_KESSEL_AUTH_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: client-secret
                    key: kessel-authentication
                    optional: true

            resources:
              limits:
                cpu: "${CPU_LIMIT_SERVICE}"
                memory: "${MEMORY_LIMIT_SERVICE}"

              requests:
                cpu: ${CPU_REQUEST_SERVICE}
                memory: ${MEMORY_REQUEST_SERVICE}

            livenessProbe:
              httpGet:
                path: /api/roadmap/v1/ping
                port: ${{WEB_PORT}}
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 6

            readinessProbe:
              httpGet:
                path: /api/roadmap/v1/ping
                port: ${{WEB_PORT}}
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 6

            volumeMounts:
              - mountPath: /tmp/tls
                name: volume-notification-backend-cert
                readOnly: true

            volumes:
              - name: volume-notification-backend-cert
                secret:
                  defaultMode: 420
                  secretName: notification-backend-cert
                  optional: true
      jobs:
        - name: notificator
          schedule: ${NOTIFICATOR_SCHEDULE}
          restartPolicy: Never
          podSpec:
            image: ${IMAGE}:${IMAGE_TAG}
            command:
              - python
              - -m
              - notificator
            env:
              - name: APP_NAME
                value: ${APP_NAME}

              - name: ROADMAP_HOST_INVENTORY_URL
                value: ${ROADMAP_HOST_INVENTORY_URL}

              - name: ROADMAP_DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.host

              - name: ROADMAP_DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.port

              - name: ROADMAP_DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.name

              - name: ROADMAP_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.user

              - name: ROADMAP_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.password

              - name: SENTRY_DSN
                valueFrom:
                  secretKeyRef:
                    name: ${SENTRY_SECRET_NAME}
                    key: dsn
                    optional: true

              - name: ROADMAP_SUBSCRIPTIONS_URL
                valueFrom:
                  secretKeyRef:
                    name: ${SUBSCRIPTION_SECRET_NAME}
                    key: url
                    optional: true

              - name: SENTRY_ENVIRONMENT
                value: ${ENV_NAME}

              - name: ROADMAP_ENV_NAME
                value: ${ENV_NAME}

              # See the api deployment above.
              - name: ROADMAP_JSON_LOGGING
                value: ${ROADMAP_JSON_LOGGING}

              - name: ROADMAP_LOG_LEVEL
                value: ${ROADMAP_LOG_LEVEL}

              - name: ROADMAP_EGRESS_ENFORCE
                value: ${ROADMAP_EGRESS_ENFORCE}

            resources:
              limits:
                cpu: ${CPU_LIMIT_NOTIFICATOR}
                memory: ${MEMORY_LIMIT_NOTIFICATOR}

              requests:
                cpu: ${CPU_REQUEST_NOTIFICATOR}
                memory: ${MEMORY_REQUEST_NOTIFICATOR}

            volumeMounts:
              - mountPath: /tmp/tls
                name: volume-notification-backend-cert
                readOnly: true

            volumes:
              - name: volume-notification-backend-cert
                secret:
                  defaultMode: 420
                  secretName: notification-backend-cert
                  optional: true

parameters:
  - name: IMAGE_TAG
    description: Image tag
    required: true
    value: latest

  - name: IMAGE
    description: Image name
    value: quay.io/redhat-services-prod/rhel-lightspeed-tenant/roadmap

  - name: ENV_NAME
    required: true

  - name: MIN_REPLICAS
    description: Replica count for backend service
    value: "3"

  - name: APP_NAME
    value: roadmap
    required: true

  - name: WEB_PORT
    description: Port this is running on
    value: "8000"

  - name: MEMORY_LIMIT_SERVICE
    value: 4096Mi

  - name: MEMORY_REQUEST_SERVICE
    value: 2048Mi

  - name: CPU_LIMIT_SERVICE
    value: "2"

  - name: CPU_REQUEST_SERVICE
    value: "1"

  - name: ROADMAP_DB_SECRET_NAME
    value: host-inventory-db-readonly

  - name: SENTRY_SECRET_NAME
    value: sentry

  - name: SUBSCRIPTION_SECRET_NAME
    value: notification-backend-url

  - name: ROADMAP_DB_POOL_SIZE
    value: ""

  - name: ROADMAP_DB_MAX_OVERFLOW
    value: ""

  - name: ROADMAP_HOST_INVENTORY_URL

  # Security logging and monitoring (SEC-MON-REQ-1). Every deployed
  # environment logs JSON so the Splunk field extractions work; leave this
  # "true" unless you are debugging a deployment by eye.
  - name: ROADMAP_JSON_LOGGING
    value: "true"

  - name: ROADMAP_LOG_LEVEL
    value: "info"

  # Egress monitoring (SEC-NET-REQ-5). Left "false" until the allow list has
  # been validated against real traffic in Splunk; see docs/EGRESS_MONITORING.md.
  # Denials are logged either way, so flipping this does not change visibility,
  # only whether an unlisted destination is blocked.
  - name: ROADMAP_EGRESS_ENFORCE
    value: "false"

  - name: NOTIFICATOR_SCHEDULE
    value: "0 6 1 * *"

  - name: CPU_REQUEST_NOTIFICATOR
    value: 500m

  - name: CPU_LIMIT_NOTIFICATOR
    value: 750m

  - name: MEMORY_REQUEST_NOTIFICATOR
    value: 2048Mi

  - name: MEMORY_LIMIT_NOTIFICATOR
    value: 4096Mi

  # Kessel / RBAC v2 authorization. Defaults keep Kessel OFF, so the legacy
  # RBAC v1 path is used until KESSEL_ENABLED is set to "true" for a given
  # environment in app-interface. These parameters are unprefixed to match the
  # shared app-sre KESSEL_* parameters; the template maps them onto the
  # ROADMAP_-prefixed container env vars the app reads.
  - name: KESSEL_ENABLED
    value: "false"

  # In-cluster Kessel Inventory gRPC endpoint. Confirm the hostname for each
  # environment with the Kessel/Inventory team before enabling.
  - name: KESSEL_URL
    value: "kessel-inventory-api:9000"

  # Set to "true" only for local/mock Kessel (no TLS, no OAuth).
  - name: KESSEL_INSECURE
    value: "false"

  - name: KESSEL_AUTH_ENABLED
    value: "true"

  # OIDC issuer (SSO realm URL) used for the OAuth2 client-credentials token.
  - name: KESSEL_AUTH_OIDC_ISSUER
    value: ""

  - name: KESSEL_PRINCIPAL_DOMAIN
    value: "redhat"
