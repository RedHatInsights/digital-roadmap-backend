apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: ${APP_NAME}

objects:
  - apiVersion: cloud.redhat.com/v1alpha1
    kind: ClowdApp
    metadata:
      name: ${APP_NAME}

    spec:
      envName: ${ENV_NAME}

      dependencies:
        - host-inventory
        - rbac
        - kessel-inventory

      kafkaTopics:
        - topicName: platform.notifications.ingress
          partitions: 24
          replicas: 3

      database:
        name: ${DB_NAME}
        version: 16

      deployments:
        - name: api
          minReplicas: ${{MIN_REPLICAS}}
          deploymentStrategy:
            privateStrategy: RollingUpdate

          webServices:
            public:
              enabled: true
              apiPath: ${APP_NAME}

          podSpec:
            image: ${IMAGE}:${IMAGE_TAG}
            env:
              - name: APP_NAME
                value: ${APP_NAME}

              - name: ROADMAP_HOST_INVENTORY_URL
                value: ${ROADMAP_HOST_INVENTORY_URL}

              - name: ROADMAP_DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.host

              - name: ROADMAP_DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.port

              - name: ROADMAP_DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.name

              - name: ROADMAP_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.user

              - name: ROADMAP_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.password

              - name: ROADMAP_DB_POOL_SIZE
                value: ${ROADMAP_DB_POOL_SIZE}

              - name: ROADMAP_DB_MAX_OVERFLOW
                value: ${ROADMAP_DB_MAX_OVERFLOW}

              - name: SENTRY_DSN
                valueFrom:
                  secretKeyRef:
                    name: ${SENTRY_SECRET_NAME}
                    key: dsn
                    optional: true

              - name: ROADMAP_SUBSCRIPTIONS_URL
                valueFrom:
                  secretKeyRef:
                    name: ${SUBSCRIPTION_SECRET_NAME}
                    key: url
                    optional: true

              - name: SENTRY_ENVIRONMENT
                value: ${ENV_NAME}

              - name: ROADMAP_ENV_NAME
                value: ${ENV_NAME}

              # Kessel / RBAC v2 authorization. Off by default; set the
              # KESSEL_ENABLED parameter to "true" per environment to use the
              # Kessel gRPC Inventory API instead of the legacy RBAC v1 path.
              # The container env vars keep the ROADMAP_ prefix (Settings uses
              # env_prefix="ROADMAP_"); the template parameters are unprefixed
              # to match the shared app-sre KESSEL_* parameters.
              - name: ROADMAP_KESSEL_ENABLED
                value: ${KESSEL_ENABLED}

              - name: ROADMAP_KESSEL_URL
                value: ${KESSEL_URL}

              - name: ROADMAP_KESSEL_INSECURE
                value: ${KESSEL_INSECURE}

              - name: ROADMAP_KESSEL_AUTH_ENABLED
                value: ${KESSEL_AUTH_ENABLED}

              - name: ROADMAP_KESSEL_AUTH_OIDC_ISSUER
                value: ${KESSEL_AUTH_OIDC_ISSUER}

              - name: ROADMAP_KESSEL_PRINCIPAL_DOMAIN
                value: ${KESSEL_PRINCIPAL_DOMAIN}

              - name: ROADMAP_KESSEL_AUTH_CLIENT_ID
                valueFrom:
                  secretKeyRef:
                    name: client-id
                    key: kessel-authentication
                    optional: true

              - name: ROADMAP_KESSEL_AUTH_CLIENT_SECRET
                valueFrom:
                  secretKeyRef:
                    name: client-secret
                    key: kessel-authentication
                    optional: true

            resources:
              limits:
                cpu: "${CPU_LIMIT_SERVICE}"
                memory: "${MEMORY_LIMIT_SERVICE}"

              requests:
                cpu: ${CPU_REQUEST_SERVICE}
                memory: ${MEMORY_REQUEST_SERVICE}

            livenessProbe:
              httpGet:
                path: /api/roadmap/v1/ping
                port: ${{WEB_PORT}}
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 6

            readinessProbe:
              httpGet:
                path: /api/roadmap/v1/ping
                port: ${{WEB_PORT}}
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 6

            volumeMounts:
              - mountPath: /tmp/tls
                name: volume-notification-backend-cert
                readOnly: true

            volumes:
              - name: volume-notification-backend-cert
                secret:
                  defaultMode: 420
                  secretName: notification-backend-cert
                  optional: true
      jobs:
        - name: notificator
          schedule: ${NOTIFICATOR_SCHEDULE}
          restartPolicy: Never
          podSpec:
            image: ${IMAGE}:${IMAGE_TAG}
            command:
              - python
              - -m
              - notificator
            env:
              - name: APP_NAME
                value: ${APP_NAME}

              - name: ROADMAP_HOST_INVENTORY_URL
                value: ${ROADMAP_HOST_INVENTORY_URL}

              - name: ROADMAP_DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.host

              - name: ROADMAP_DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.port

              - name: ROADMAP_DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.name

              - name: ROADMAP_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.user

              - name: ROADMAP_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.password

              - name: SENTRY_DSN
                valueFrom:
                  secretKeyRef:
                    name: ${SENTRY_SECRET_NAME}
                    key: dsn
                    optional: true

              - name: ROADMAP_SUBSCRIPTIONS_URL
                valueFrom:
                  secretKeyRef:
                    name: ${SUBSCRIPTION_SECRET_NAME}
                    key: url
                    optional: true

              - name: SENTRY_ENVIRONMENT
                value: ${ENV_NAME}

            resources:
              limits:
                cpu: ${CPU_LIMIT_NOTIFICATOR}
                memory: ${MEMORY_LIMIT_NOTIFICATOR}

              requests:
                cpu: ${CPU_REQUEST_NOTIFICATOR}
                memory: ${MEMORY_REQUEST_NOTIFICATOR}

            volumeMounts:
              - mountPath: /tmp/tls
                name: volume-notification-backend-cert
                readOnly: true

            volumes:
              - name: volume-notification-backend-cert
                secret:
                  defaultMode: 420
                  secretName: notification-backend-cert
                  optional: true

        - name: inventory-sync
          restartPolicy: Never
          podSpec:
            image: ${IMAGE}:${IMAGE_TAG}
            env:
              - name: LOG_LEVEL
                value: ${LOG_LEVEL}

              - name: DB_SSL_MODE
                value: ${DB_SSL_MODE}

              - name: CLOWDER_ENABLED
                value: "true"

              - name: HBI_PUBLICATION
                value: hbi_hosts_pub_v1_0_0

              - name: HBI_SUBSCRIPTION
                value: ${APP_NAME}_hosts_sub

              - name: ALTER_SUBSCRIPTION
                value: ${ALTER_SUBSCRIPTION}

              - name: DROP_SUBSCRIPTION
                value: ${DROP_SUBSCRIPTION}

              - name: DROP_HBI_TABLE
                value: ${DROP_HBI_TABLE}

              - name: DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.name

            args:
              - /opt/venvs/replication/bin/python
              - /usr/local/bin/replication.py

            resources:
              limits:
                cpu: ${CPU_LIMIT_INVENTORY_SYNC}
                memory: ${MEMORY_LIMIT_INVENTORY_SYNC}

              requests:
                cpu: ${CPU_REQUEST_INVENTORY_SYNC}
                memory: ${MEMORY_REQUEST_INVENTORY_SYNC}

            database:
              sharedDbAppName: ${DB_NAME}

            volumeMounts:
              - name: host-inventory-db
                mountPath: /etc/db/hbi
                readOnly: true

              - name: rds-client-ca
                mountPath: /etc/db/rdsclientca
                readOnly: true

            volumes:
              - name: host-inventory-db
                secret:
                  secretName: host-inventory-db
                  optional: true
                  items:
                    - key: db.host
                      path: db_host

                    - key: db.name
                      path: db_name

                    - key: db.password
                      path: db_password

                    - key: db.port
                      path: db_port

                    - key: db.user
                      path: db_user

              - name: rds-client-ca
                secret:
                  secretName: rds-client-ca
                  optional: true
                  items:
                    - key: rds-cacert
                      path: rds_cacert

parameters:
  - name: IMAGE_TAG
    description: Image tag
    required: true
    value: latest

  - name: IMAGE
    description: Image name
    value: quay.io/redhat-services-prod/rhel-lightspeed-tenant/roadmap

  - name: ENV_NAME
    required: true

  - name: MIN_REPLICAS
    description: Replica count for backend service
    value: "3"

  - name: APP_NAME
    value: roadmap
    required: true

  - name: WEB_PORT
    description: Port this is running on
    value: "8000"

  - name: MEMORY_LIMIT_SERVICE
    value: 4096Mi

  - name: MEMORY_REQUEST_SERVICE
    value: 2048Mi

  - name: CPU_LIMIT_SERVICE
    value: "2"

  - name: CPU_REQUEST_SERVICE
    value: "1"

  - name: ROADMAP_DB_SECRET_NAME
    value: host-inventory-db-readonly

  - name: SENTRY_SECRET_NAME
    value: sentry

  - name: SUBSCRIPTION_SECRET_NAME
    value: notification-backend-url

  - name: ROADMAP_DB_POOL_SIZE
    value: ""

  - name: ROADMAP_DB_MAX_OVERFLOW
    value: ""

  - name: DB_NAME
    required: true
    value: roadmap

  - name: ROADMAP_HOST_INVENTORY_URL

  - name: CPU_REQUEST_INVENTORY_SYNC
    value: 250m

  - name: CPU_LIMIT_INVENTORY_SYNC
    value: 500m

  - name: MEMORY_REQUEST_INVENTORY_SYNC
    value: 256Mi

  - name: MEMORY_LIMIT_INVENTORY_SYNC
    value: 512Mi

  - name: DB_SSL_MODE
    value: prefer

  - name: ALTER_SUBSCRIPTION
    value: ''

  - name: DROP_SUBSCRIPTION
    value: ''

  - name: DROP_HBI_TABLE
    value: ''

  - name: INVENTORY_SYNC_COUNTER
    value: '1'

  - name: NOTIFICATOR_SCHEDULE
    value: "0 6 1 * *"

  - name: CPU_REQUEST_NOTIFICATOR
    value: 500m

  - name: CPU_LIMIT_NOTIFICATOR
    value: 750m

  - name: MEMORY_REQUEST_NOTIFICATOR
    value: 2048Mi

  - name: MEMORY_LIMIT_NOTIFICATOR
    value: 4096Mi

  - name: LOG_LEVEL
    value: DEBUG

  # Kessel / RBAC v2 authorization. Defaults keep Kessel OFF, so the legacy
  # RBAC v1 path is used until KESSEL_ENABLED is set to "true" for a given
  # environment in app-interface. These parameters are unprefixed to match the
  # shared app-sre KESSEL_* parameters; the template maps them onto the
  # ROADMAP_-prefixed container env vars the app reads.
  - name: KESSEL_ENABLED
    value: "false"

  # In-cluster Kessel Inventory gRPC endpoint. Confirm the hostname for each
  # environment with the Kessel/Inventory team before enabling.
  - name: KESSEL_URL
    value: "kessel-inventory-api:9000"

  # Set to "true" only for local/mock Kessel (no TLS, no OAuth).
  - name: KESSEL_INSECURE
    value: "false"

  - name: KESSEL_AUTH_ENABLED
    value: "true"

  # OIDC issuer (SSO realm URL) used for the OAuth2 client-credentials token.
  - name: KESSEL_AUTH_OIDC_ISSUER
    value: ""

  - name: KESSEL_PRINCIPAL_DOMAIN
    value: "redhat"
