apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: ${APP_NAME}

objects:
  - apiVersion: cloud.redhat.com/v1alpha1
    kind: ClowdApp
    metadata:
      name: ${APP_NAME}

    spec:
      envName: ${ENV_NAME}

      dependencies:
        - host-inventory
        - rbac

      kafkaTopics:
        - topicName: platform.notifications.ingress
          partitions: 24
          replicas: 3

      deployments:
        - name: api
          minReplicas: ${{MIN_REPLICAS}}
          deploymentStrategy:
            privateStrategy: RollingUpdate

          webServices:
            public:
              enabled: true
              apiPath: ${APP_NAME}

          podSpec:
            image: ${IMAGE}:${IMAGE_TAG}
            env:
              - name: APP_NAME
                value: ${APP_NAME}

              - name: ROADMAP_HOST_INVENTORY_URL
                value: ${ROADMAP_HOST_INVENTORY_URL}

              - name: ROADMAP_DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.host

              - name: ROADMAP_DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.port

              - name: ROADMAP_DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.name

              - name: ROADMAP_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.user

              - name: ROADMAP_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.password

              - name: ROADMAP_DB_POOL_SIZE
                value: ${ROADMAP_DB_POOL_SIZE}

              - name: ROADMAP_DB_MAX_OVERFLOW
                value: ${ROADMAP_DB_MAX_OVERFLOW}

              - name: SENTRY_DSN
                valueFrom:
                  secretKeyRef:
                    name: ${SENTRY_SECRET_NAME}
                    key: dsn
                    optional: true

              - name: ROADMAP_SUBSCRIPTIONS_URL
                valueFrom:
                  secretKeyRef:
                    name: ${SUBSCRIPTION_SECRET_NAME}
                    key: url
                    optional: true

              - name: SENTRY_ENVIRONMENT
                value: ${ENV_NAME}

              - name: ROADMAP_ENV_NAME
                value: ${ENV_NAME}

            resources:
              limits:
                cpu: "${CPU_LIMIT_SERVICE}"
                memory: "${MEMORY_LIMIT_SERVICE}"

              requests:
                cpu: ${CPU_REQUEST_SERVICE}
                memory: ${MEMORY_REQUEST_SERVICE}

            livenessProbe:
              httpGet:
                path: /api/roadmap/v1/ping
                port: ${{WEB_PORT}}
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 6

            readinessProbe:
              httpGet:
                path: /api/roadmap/v1/ping
                port: ${{WEB_PORT}}
              initialDelaySeconds: 15
              periodSeconds: 15
              timeoutSeconds: 10
              failureThreshold: 6

            volumeMounts:
              - mountPath: /tmp/tls
                name: volume-notification-backend-cert
                readOnly: true

            volumes:
              - name: volume-notification-backend-cert
                secret:
                  defaultMode: 420
                  secretName: notification-backend-cert
                  optional: true
      jobs:
        - name: notificator
          schedule: ${NOTIFICATOR_SCHEDULE}
          restartPolicy: Never
          podSpec:
            image: ${IMAGE}:${IMAGE_TAG}
            command:
              - python
              - -m
              - notificator
            env:
              - name: APP_NAME
                value: ${APP_NAME}

              - name: ROADMAP_HOST_INVENTORY_URL
                value: ${ROADMAP_HOST_INVENTORY_URL}

              - name: ROADMAP_DB_HOST
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.host

              - name: ROADMAP_DB_PORT
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.port

              - name: ROADMAP_DB_NAME
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.name

              - name: ROADMAP_DB_USER
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.user

              - name: ROADMAP_DB_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: ${ROADMAP_DB_SECRET_NAME}
                    key: db.password

              - name: SENTRY_DSN
                valueFrom:
                  secretKeyRef:
                    name: ${SENTRY_SECRET_NAME}
                    key: dsn
                    optional: true

              - name: ROADMAP_SUBSCRIPTIONS_URL
                valueFrom:
                  secretKeyRef:
                    name: ${SUBSCRIPTION_SECRET_NAME}
                    key: url
                    optional: true

              - name: SENTRY_ENVIRONMENT
                value: ${ENV_NAME}

            resources:
              limits:
                cpu: ${CPU_LIMIT_NOTIFICATOR}
                memory: ${MEMORY_LIMIT_NOTIFICATOR}

              requests:
                cpu: ${CPU_REQUEST_NOTIFICATOR}
                memory: ${MEMORY_REQUEST_NOTIFICATOR}

            volumeMounts:
              - mountPath: /tmp/tls
                name: volume-notification-backend-cert
                readOnly: true

            volumes:
              - name: volume-notification-backend-cert
                secret:
                  defaultMode: 420
                  secretName: notification-backend-cert
                  optional: true

parameters:
  - name: IMAGE_TAG
    description: Image tag
    required: true
    value: latest

  - name: IMAGE
    description: Image name
    value: quay.io/redhat-services-prod/rhel-lightspeed-tenant/roadmap

  - name: ENV_NAME
    required: true

  - name: MIN_REPLICAS
    description: Replica count for backend service
    value: "3"

  - name: APP_NAME
    value: roadmap
    required: true

  - name: WEB_PORT
    description: Port this is running on
    value: "8000"

  - name: MEMORY_LIMIT_SERVICE
    value: 4096Mi

  - name: MEMORY_REQUEST_SERVICE
    value: 2048Mi

  - name: CPU_LIMIT_SERVICE
    value: "2"

  - name: CPU_REQUEST_SERVICE
    value: "1"

  - name: ROADMAP_DB_SECRET_NAME
    value: host-inventory-db-readonly

  - name: SENTRY_SECRET_NAME
    value: sentry

  - name: SUBSCRIPTION_SECRET_NAME
    value: notification-backend-url

  - name: ROADMAP_DB_POOL_SIZE
    value: ""

  - name: ROADMAP_DB_MAX_OVERFLOW
    value: ""

  - name: ROADMAP_HOST_INVENTORY_URL

  - name: NOTIFICATOR_SCHEDULE
    value: "0 6 1 * *"

  - name: CPU_REQUEST_NOTIFICATOR
    value: 500m

  - name: CPU_LIMIT_NOTIFICATOR
    value: 750m

  - name: MEMORY_REQUEST_NOTIFICATOR
    value: 2048Mi

  - name: MEMORY_LIMIT_NOTIFICATOR
    value: 4096Mi
